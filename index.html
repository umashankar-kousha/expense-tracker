<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
          <div class="container-fluid">
            <a class="navbar-brand" href="#">Expense Tracker</a>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNavDropdown"
              aria-controls="navbarNavDropdown"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a
                    class="nav-link active"
                    aria-current="page"
                    href="./index.html"
                    >Home</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="./transactions.html"
                    >Transactions</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </header>
      <main class="bg-container container">
        <section class="summary">
          <div class="border border-primary balance-card">
            <span>Your Balance</span>
            <h3 class="text-primary balance" id="balance"></h3>
          </div>
          <div class="border border-success income-card" style="width: 40%">
            <span>Income</span>
            <h3 class="green fw-bold" id="totalIncome"></h3>
          </div>
          <div class="border border-danger expense-card" style="width: 40%">
            <span>Expense</span>
            <h3 class="red fw-bold" id="totalExpense"></h3>
          </div>
        </section>
        <section class="bottom-container">
          <div class="recent-trnasactions-container">
            <h2>Recent Transactions</h2>
            <ul id="RecentTransactions"></ul>
          </div>

          <div class="form-container">
            <form action="" class="hide" id="addtransaction">
              <input
                type="text"
                placeholder="Transaction Name"
                required
                id="transactionName"
              />
              <input type="text" placeholder="Amount" required id="amount" />
              <div class="radio-group">
                <div class="d-flex align-items-center">
                  <label for="Income" class="green"> Income</label>
                  <input
                    type="radio"
                    name="type"
                    value="Income"
                    id="Income"
                    checked
                  />
                </div>
                <div class="d-flex align-items-center">
                  <label for="Expense" class="red"> Expense</label>
                  <input
                    type="radio"
                    name="type"
                    value="Expense"
                    id="Expense"
                  />
                </div>
              </div>
              <button class="add-button btn-primary" type="submit">
                Add Transaction
              </button>
            </form>
            <button
              class="float-button btn-primary"
              id="addTransactionBtnContainer"
            >
              +
            </button>
          </div>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
